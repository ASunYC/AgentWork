name: agentwork

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
  networks:
    - backend

services:
  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agentwork}
      POSTGRES_USER: ${POSTGRES_USER:-agentwork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 512m
    cpus: 1.0

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    command:
      [
        redis-server,
        --appendonly,
        'yes',
        --maxmemory,
        96mb,
        --maxmemory-policy,
        allkeys-lru,
      ]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 128m
    cpus: 0.5

  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: agentwork-api:${IMAGE_TAG:-local}
    command: [node, node_modules/@agentwork/database/dist/migrate.js]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agentwork}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentwork}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - backend
    mem_limit: 256m
    cpus: 0.5

  api:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: agentwork-api:${IMAGE_TAG:-local}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-agentwork}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentwork}
      REDIS_URL: redis://redis:6379
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?AUTH_JWT_SECRET is required}
      CHALLENGE_SECRET: ${CHALLENGE_SECRET:?CHALLENGE_SECRET is required}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
    ports:
      - '127.0.0.1:${API_BIND_PORT:-3101}:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 384m
    cpus: 1.0

  worker:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    image: agentwork-worker:${IMAGE_TAG:-local}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      WORKER_HEALTH_PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-agentwork}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agentwork}
      REDIS_URL: redis://redis:6379
      WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:?WEBHOOK_SIGNING_SECRET is required}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.75

  web:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: agentwork-web:${IMAGE_TAG:-local}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=256
      API_BASE_URL: http://api:3001
    ports:
      - '127.0.0.1:${WEB_BIND_PORT:-3100}:3000'
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 384m
    cpus: 1.0

networks:
  backend:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
